name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run suite (schema + build + site invariants)
        run: node --test tests/*.test.mjs

  deploy:
    # The gate: deployment exists ONLY downstream of a green test job on main.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site from data
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live deployment
        # AUDIT cannot reach selfhostspecs.com from its cloud sandbox (egress policy blocks it,
        # confirmed 2026-07-27) — this runner has real internet access, so it's the one place
        # that can actually confirm the deploy is live and serving the right content.
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/smoke.html -w "%{http_code}" "$url")
            [ "$code" = "200" ] && break
            echo "attempt $attempt: HTTP $code, retrying in 5s"
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error::Live site returned HTTP $code after 5 attempts"
            exit 1
          fi
          grep -q "SelfhostSpecs" /tmp/smoke.html || { echo "::error::Expected marker text 'SelfhostSpecs' not found on live page"; exit 1; }
